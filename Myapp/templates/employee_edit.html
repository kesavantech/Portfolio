{% extends 'base.html' %}

{% block title %}
Employee Edit
{% endblock  %}

{% block content %}

<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>Edit Employees</h1>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="row py-4">
                <div class="col-6">
                    <label for="emp_name" class="form-label">Emp name</label>
                    <input type="text" name="emp_name" value="{{ employee.emp_name }}" class="form-control ">
                </div>
                <div class="col-6 mb-3">
                    <label for="emp_email" class="form-label">Emp Email</label>
                    <input type="text" name="emp_email" value="{{ employee.emp_email }}" class="form-control">
                </div>
                <div class="col-6 mb-3">
                    <label for="emp_phone" class="form-label">Emp Phone</label>
                    <input type="text" name="emp_phone" value="{{ employee.emp_phone }}" class="form-control">
                </div>
                <div class="col-6 mb-3">
                    <label for="emp_salary" class="form-label">Emp Salary</label>
                    <input type="text" name="emp_salary" value="{{ employee.emp_salary }}" class="form-control">
                </div>
                <div class="col-6 mb-3">
                    <label for="emp_address" class="form-label">Emp Address</label>
                    <input type="text" name="emp_address" value="{{ employee.emp_address }}" class="form-control">
                </div>
            </div>

            <div class="card-footer btn btn-primary">
                <button type="submit">Update</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
